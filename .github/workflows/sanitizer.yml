name: Sanitizers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: sanitizer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect affected source files
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        if: (github.event_name == 'push' && github.ref_type != 'tag') || github.event_name == 'pull_request'
        with:
          base: ${{ github.ref }}
          filters: |
            code:
              - 'src/**'
              - 'include/**'
              - 'tests/**'
              - 'cmake/**'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - '.clang-format'
              - '.clang-tidy'
              - '.github/workflows/sanitizer.yml'
  asan-ubsan:
    needs: changes
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'workflow_call' || github.ref_type == 'tag' || needs.changes.outputs.code == 'true'
    name: Sanitizers / ASan + UBSan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y clang ninja-build

      - name: Configure
        shell: bash
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DLIBMMD_BUILD_TESTS=ON
          -DLIBMMD_INSTALL=OFF
          -DLIBMMD_ENABLE_PHYSICS=OFF
          -DLIBMMD_ENABLE_BULLET=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel 2
