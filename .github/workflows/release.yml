name: Release

on:
  push:
    tags: ['v*.*.*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Release / verify version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify tag and CMake version
        id: version
        shell: bash
        run: |
          version=$(sed -nE 's/^project\(libmmd VERSION ([0-9]+\.[0-9]+\.[0-9]+).*$/\1/p' CMakeLists.txt)
          tag_version="${GITHUB_REF_NAME#v}"
          test -n "$version"
          test "$tag_version" = "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  package:
    needs: version
    uses: ./.github/workflows/package.yml

  publish:
    name: Release / publish artifacts
    needs: [version, ci, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout tag
        uses: actions/checkout@v7

      - name: Create source packages
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git archive --format=tar.gz --prefix="libmmd-${VERSION}/" -o "libmmd-${VERSION}.tar.gz" HEAD
          git archive --format=zip --prefix="libmmd-${VERSION}/" -o "libmmd-${VERSION}.zip" HEAD

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: |
            libmmd-${{ needs.version.outputs.version }}.tar.gz
            libmmd-${{ needs.version.outputs.version }}.zip
