name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lint-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Lint / format
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-format python3-venv
          python3 -m venv .venv
          .venv/bin/pip install --disable-pip-version-check gersemi

      - name: Check C++ formatting
        shell: bash
        run: |
          find include src tests -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror

      - name: Check CMake formatting
        run: .venv/bin/gersemi --check --warnings-as-errors --no-warn-about-unknown-commands .

  clang-tidy:
    name: Lint / clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y clang clang-tidy ninja-build

      - name: Configure
        run: >-
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DLIBMMD_BUILD_TESTS=ON
          -DLIBMMD_INSTALL=OFF
          -DLIBMMD_ENABLE_PHYSICS=OFF
          -DLIBMMD_ENABLE_BULLET=OFF

      - name: Run clang-tidy
        run: run-clang-tidy -p build -quiet '.*/src/.*\.cpp$'
